<style>

#ts{position:fixed;top:14px;right:14px;z-index:30;color:#fff;padding:10px 16px;border-radius:12px;display:none}

<script type="module">
// KONFIGURASI APLIKASI
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
  apiKey: "AIzaSyD6ao1Wvt4gL5g6BIdx-mnqyXwznYuu4es",

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),nowT=()=>new Date().toTimeString().slice(0,5),uid=()=>Math.random().toString(36).slice(2,10),tok=()=>crypto.randomUUID().replace(/-/g,'');
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const EM='<p class="em">Belum ada data</p>',DAYS={'Senin - Sabtu':[1,2,3,4,5,6],'Senin - Jumat':[1,2,3,4,5],'Setiap hari':[0,1,2,3,4,5,6],'Sabtu - Kamis':[6,0,1,2,3,4]};
const D={school:{},classes:[],students:[],users:[],activities:[],attendance:[]},V={u:null,role:null,page:'dash',date:today(),d1:today(),d2:today(),fc:'',fa:'',fs:'',q:'',sel:{}};
let fb={},M=null;
const cn=id=>D.classes.find(c=>c.id==id)?.name||'-',isOn=a=>a.active!==false&&(DAYS[a.days]||DAYS['Setiap hari']).includes(new Date().getDay());
const bd=s=>`<span class="badge ${{Terlambat:'w',Sakit:'i',Izin:'i',Alpa:'x'}[s]||''}">${s}</span>`;
const tbl=(h,r)=>r.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:EM;
function toast(m,t){const e=$('#ts');e.textContent=m;e.style.background=t=='x'?'#dc2626':'#16a34a';e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
const DB={
 async load(c){if(IS_PREVIEW)return;const cut=new Date(Date.now()-90*864e5).toLocaleDateString('sv-SE'),q=c=='attendance'?fb.query(fb.collection(fb.db,c),fb.where('date','>=',cut)):fb.collection(fb.db,c);D[c]=(await fb.getDocs(q)).docs.map(d=>({id:d.id,...d.data()}))},
 async put(c,o){if(!IS_PREVIEW){const{id,...r}=o;await fb.setDoc(fb.doc(fb.db,c,id),JSON.parse(JSON.stringify(r)))}const i=D[c].findIndex(x=>x.id==o.id);i<0?D[c].push(o):D[c][i]=o},
 async del(c,id){if(!IS_PREVIEW)await fb.deleteDoc(fb.doc(fb.db,c,id));D[c]=D[c].filter(x=>x.id!=id)},
 async school(o){if(!IS_PREVIEW)await fb.setDoc(fb.doc(fb.db,'school','profile'),o);D.school=o}};
async function loadAll(){if(IS_PREVIEW)return;for(const c of['classes','students','activities','attendance',...(V.role=='admin'?['users']:[])])await DB.load(c);const s=await fb.getDoc(fb.doc(fb.db,'school','profile'));D.school=s.exists()?s.data():{}}
async function seed(){D.school={name:'MTsN 6 Ciamis',address:'Ciamis, Jawa Barat',slogan:'Disiplin Hari Ini, Prestasi Esok Nanti'};D.classes=[{id:'c1',name:'VII A'},{id:'c2',name:'VIII B'}];
D.students=[{id:'s1',nisn:'0065432178',name:'Ahmad Fauzi',gender:'L',classId:'c1',status:'Aktif',qrToken:'demo-token-1'},{id:'s2',nisn:'0065432179',name:'Aisyah Rahma',gender:'P',classId:'c1',status:'Aktif',qrToken:'demo-token-2'}];
D.activities=[{id:'a1',name:'Masuk Pagi',type:'Masuk',start:'00:00',onTime:'06:45',end:'23:59',days:'Setiap hari',classId:'',active:true},{id:'a2',name:'Salat Duha',type:'Keagamaan',start:'00:00',onTime:'',end:'23:59',days:'Setiap hari',classId:'',active:true}];
D.users=[{id:'guru',name:'Guru Piket Demo',hash:await sha('guru'+'guru123'),active:true}];
D.attendance=[{id:today()+'_a1_s1',date:today(),actId:'a1',actName:'Masuk Pagi',stuId:'s1',nisn:'0065432178',name:'Ahmad Fauzi',classId:'c1',status:'Hadir',time:'06:32',by:'guru',verified:true}]}
function pwa(){const m={name:'HADIR',short_name:'HADIR',start_url:'.',display:'standalone',background_color:'#F8FAFC',theme_color:'#2563EB',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#2563EB"/><text x="50" y="66" font-size="48" text-anchor="middle" fill="#fff">QR</text></svg>'),sizes:'any',type:'image/svg+xml'}]};
const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
try{navigator.serviceWorker?.register(URL.createObjectURL(new Blob(["self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',()=>{})"],{type:'text/javascript'}))).catch(()=>{})}catch(e){}}
const MA=[['dash','📊 Dashboard'],['sekolah','🏫 Identitas Sekolah'],'MASTER DATA',['kelas','📚 Data Kelas'],['siswa','🎓 Data Siswa'],['qr','🔳 QR Code Siswa'],'PENGATURAN',['jam','🕒 Jam Kehadiran'],['keg','🗓️ Kegiatan'],'ADMINISTRASI',['rekap','📋 Rekap Absensi'],['lap','📈 Laporan'],['user','👤 Pengguna']];
const MP=[['dash','🏠 Beranda'],['scan','📷 Absensi'],['riw','🕘 Riwayat'],['prof','👤 Profil']];
function draw(){const app=$('#app');if(!V.u){app.innerHTML=`<div class="login"><div>${D.school.logo?`<img src="${D.school.logo}" width=64>`:'<div style="font-size:48px">🕌</div>'}<h1>HADIR</h1><p>Sistem Absensi Digital Siswa<br>${esc(D.school.name||'MTsN 6 Ciamis')}</p><h3 style="margin-top:20px">“${esc(D.school.slogan||'Disiplin Hari Ini, Prestasi Esok Nanti')}”</h3></div>
<form onsubmit="A.login(event)"><h2>Selamat Datang</h2><p style="color:#64748b">Silakan login untuk mengakses aplikasi absensi siswa.</p><label>Username / Email Admin<input id="lu" required autocomplete="username"></label><label>Password<input id="lp" type="password" required autocomplete="current-password"></label><label><input id="lr" type="checkbox" checked> Ingat saya</label><button class="btn p">Login</button>
${IS_PREVIEW?'<div class="card" style="background:#eff6ff"><b>Mode Preview</b><br><small>Admin: admin@demo.com / admin123<br>Guru Piket: guru / guru123</small></div>':''}</form></div>`;return}
const mn=V.role=='admin'?MA:MP,P=V.role=='admin'?PA:PP,nav=mn.filter(x=>typeof x!='string');
const short=V.role=='admin'?['dash','siswa','qr','rekap']:['dash','scan','riw','prof'];
app.innerHTML=`<div class="side"><div style="font-weight:700;font-size:16px;padding:6px 8px">${D.school.logo?`<img src="${D.school.logo}" width=28 style="vertical-align:middle"> `:'🕌 '}HADIR<br><small style="font-weight:400;opacity:.8;margin:0">Absensi Digital Siswa</small></div>${mn.map(x=>typeof x=='string'?`<small>${x}</small>`:`<a class="${V.page==x[0]?'on':''}" onclick="A.go('${x[0]}')">${x[1]}</a>`).join('')}<div style="margin-top:auto"><a onclick="A.logout()">🚪 Logout (${esc(V.u.name)})</a></div></div>
<main><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><h2>${esc((nav.find(x=>x[0]==V.page)||[0,''])[1].replace(/^\S+\s/,''))}</h2><small style="color:#64748b">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small></div><div style="text-align:right"><b>${esc(V.u.name)}</b><br><small>${V.role=='admin'?'Administrator':'Guru Piket'}</small></div></div>
${IS_PREVIEW?'<div class="card" style="background:#fef9c3;margin-bottom:12px"><small>⚠️ MODE PREVIEW — data hanya di memori, tidak tersimpan ke Firebase.</small></div>':''}${(P[V.page]||P.dash)()}</main>
<div class="nav-b">${short.map(k=>{const x=nav.find(n=>n[0]==k);return`<a class="${V.page==k?'on':''}" onclick="A.go('${k}')">${x[1].replace(' ','<br>')}</a>`}).join('')}${V.role=='admin'?'<a onclick="A.more()">☰<br>Lainnya</a>':''}</div>`}
function form(title,fs,o,save){M=save;$('#md').innerHTML=`<div class="modal"><div><h3>${title}</h3><form onsubmit="A.sub(event)" style="display:grid;gap:10px;margin-top:12px">${fs.map(f=>`<label>${f.l}${f.t=='sel'?`<select name="${f.k}">${f.o.map(x=>`<option value="${esc(x[0])}" ${o[f.k]==x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(o[f.k])}" ${f.r===0?'':'required'}>`}</label>`).join('')}<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" onclick="A.x()">Batal</button><button class="btn p">Simpan</button></div></form></div></div>`}
const recent=n=>{const r=D.attendance.filter(a=>a.date==today()).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,n);return tbl(['Nama','Kelas','Kegiatan','Waktu','Status'],r.map(a=>[esc(a.name),cn(a.classId),esc(a.actName),a.time,bd(a.status)]))};
function stats(){const t=today(),m=D.activities.find(a=>a.type=='Masuk'),ac=D.students.filter(s=>s.status!='Nonaktif'),r=m?D.attendance.filter(a=>a.date==t&&a.actId==m.id):[],ok=r.filter(a=>['Hadir','Terlambat'].includes(a.status));return{ac,r,ok,tl:r.filter(a=>a.status=='Terlambat').length}}
const PA={
dash(){const{ac,r,ok,tl}=stats();return`<div class="grid g4">${[['👥','Total Siswa',ac.length,'siswa aktif'],['🏫','Total Kelas',D.classes.length,'kelas'],['✅','Hadir',ok.length,tl+' terlambat'],['⏳','Belum Hadir',ac.length-r.length,'belum tercatat']].map(x=>`<div class="card"><div style="font-size:22px">${x[0]}</div><small>${x[1]}</small><h2>${x[2]}</h2><small>${x[3]}</small></div>`).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Rekap Kehadiran per Kelas</h3>${D.classes.length?D.classes.map(c=>{const n=ac.filter(s=>s.classId==c.id).length,p=ok.filter(a=>a.classId==c.id).length,pc=n?Math.round(p*100/n):0;return`<div style="margin:8px 0">${esc(c.name)} <b>${pc}%</b><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join(''):EM}</div><div class="card"><h3>Kegiatan Hari Ini</h3>${D.activities.filter(isOn).map(a=>`<div style="padding:4px 0">${esc(a.name)} <small>${a.start}–${a.end}</small></div>`).join('')||EM}</div></div><div class="card" style="margin-top:14px"><h3>Absensi Terbaru</h3>${recent(8)}</div>`},
sekolah(){const s=D.school;return`<div class="card" style="max-width:520px;display:grid;gap:10px"><label>Nama Madrasah<input id="sn" value="${esc(s.name)}"></label><label>Alamat<input id="sa" value="${esc(s.address)}"></label><label>Slogan<input id="ss" value="${esc(s.slogan)}"></label><label>Logo<input type="file" accept="image/*" onchange="A.logo(this)"></label><img id="lg" src="${s.logo||''}" width=64 ${s.logo?'':'hidden'}><button class="btn p" onclick="A.saveSek()">Simpan</button></div>`},
kelas(){return`<div class="card"><button class="btn p" onclick="A.editK()">+ Tambah Kelas</button>${tbl(['Kelas','Jumlah Siswa','Aksi'],D.classes.map(c=>[esc(c.name),D.students.filter(s=>s.classId==c.id).length,`<button class="btn" onclick="A.editK('${c.id}')">Edit</button> <button class="btn r" onclick="A.delK('${c.id}')">Hapus</button>`]))}</div>`},
siswa(){const q=V.q.toLowerCase(),r=D.students.filter(s=>(!V.fc||s.classId==V.fc)&&(!q||s.name.toLowerCase().includes(q)||s.nisn.includes(q)));return`<div class="card"><div class="row"><input placeholder="Cari nama / NISN" value="${esc(V.q)}" onchange="A.flt('q',this.value)"><select onchange="A.flt('fc',this.value)"><option value="">Semua Kelas</option>${D.classes.map(c=>`<option value="${c.id}" ${V.fc==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn p" onclick="A.editS()">+ Tambah Siswa</button></div><div class="row"><label class="btn">Impor Excel<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="A.impS(this)"></label><button class="btn" onclick="A.expS()">Ekspor</button><button class="btn" onclick="A.qrPrint(D.students.filter(s=>s.status!='Nonaktif'))">Cetak QR Semua</button></div><small>Format impor: kolom NISN, Nama, Kelas, JK (L/P)</small>${tbl(['No','NISN','Nama','Kelas','Status','Aksi'],r.map((s,i)=>[i+1,esc(s.nisn),esc(s.name),cn(s.classId),bd(s.status=='Aktif'?'Hadir':'Alpa').replace(/Hadir|Alpa/,s.status),`<button class="btn" onclick="A.editS('${s.id}')">Edit</button> <button class="btn" onclick="A.qrPrint([D.students.find(x=>x.id=='${s.id}')])">QR</button> <button class="btn r" onclick="A.delS('${s.id}')">Hapus</button>`]))}</div>`},
qr(){const ss=D.students.filter(s=>V.sel[s.classId]&&s.status!='Nonaktif'),p=ss[0];setTimeout(()=>{const e=$('#pv');if(e&&p){e.innerHTML='';new QRCode(e,{text:p.qrToken,width:150,height:150})}});return`<div class="grid g2"><div class="card"><h3>Pilih Kelas</h3>${D.classes.map(c=>`<label style="display:flex;gap:8px;padding:6px"><input type="checkbox" ${V.sel[c.id]?'checked':''} onchange="A.qrSel('${c.id}')">${esc(c.name)} <small>(${D.students.filter(s=>s.classId==c.id).length})</small></label>`).join('')||EM}</div><div class="card"><h3>Pratinjau Kartu</h3>${p?`<div class="ic"><b>${esc(D.school.name||'')}</b><br>${esc(p.name)}<br><small>NISN: ${esc(p.nisn)} · Kelas ${cn(p.classId)}</small><br><div class="q" id="pv"></div></div>`:EM}<div class="row"><button class="btn p" onclick="A.qrPrint(D.students.filter(s=>V.sel[s.classId]&&s.status!='Nonaktif'))">Cetak / Simpan PDF</button><button class="btn" onclick="A.qrDl()">Unduh QR (PNG)</button></div></div></div>`},
jam(){return sett('Masuk','Pulang')},keg(){return sett()},
rekap(){const r=rows();return`<div class="card">${filt()}<div class="row"><button class="btn" onclick="A.alpa()">Tandai Alpa (belum tercatat)</button><button class="btn" onclick="A.expR()">Ekspor Excel</button></div>${tbl(['Tanggal','NISN','Nama','Kelas','Kegiatan','Waktu','Status','Verifikasi'],r.map(a=>[a.date,esc(a.nisn),esc(a.name),cn(a.classId),esc(a.actName),a.time,bd(a.status),['Sakit','Izin'].includes(a.status)&&!a.verified?`<button class="btn" onclick="A.ver('${a.id}')">Verifikasi</button>`:'✓']))}</div>`},
lap(){const r=rows(),m={};r.forEach(a=>{(m[a.stuId]=m[a.stuId]||{n:a.name,c:a.classId,Hadir:0,Terlambat:0,Sakit:0,Izin:0,Alpa:0})[a.status]++});V.lap=Object.values(m);return`<div class="card">${filt()}<div class="row"><button class="btn p" onclick="A.expL()">Ekspor Excel</button><button class="btn" onclick="A.prtL()">Cetak</button></div>${tbl(['Nama','Kelas','Hadir','Terlambat','Sakit','Izin','Alpa'],V.lap.map(x=>[esc(x.n),cn(x.c),x.Hadir,x.Terlambat,x.Sakit,x.Izin,x.Alpa]))}</div>`},
